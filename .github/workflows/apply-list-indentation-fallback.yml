name: Apply list indentation fallback

on:
  push:
    branches:
      - feature/numbering-class-map-list-ordering
    paths:
      - .github/workflows/apply-list-indentation-fallback.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/numbering-class-map-list-ordering
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 .github/scripts/add-list-indentation-fallback.py
          git add lib test README.md
          git commit -m "Infer flattened list nesting from indentation"
          npm ci
          npm test
          git push origin HEAD:feature/numbering-class-map-list-ordering
