name: Remove PR 448 list continuation

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/remove-pr448-list-continuation.yml

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - name: Remove PR 448 list continuation logic
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # document-to-html.js: keep our numbering classes, indentation inference
          # and alignment, but remove PR #448 continuation/list-state machinery.
          path = Path('lib/document-to-html.js')
          text = path.read_text()

          text = text.replace('''    var referencedComments = [];\n    \n    var listState = {\n        currentLists: {} // Track current lists by key (numId + level + isOrdered)\n    };\n\n''', '''    var referencedComments = [];\n\n''', 1)
          text = text.replace(
              'var html = elementToHtml(document, messages, {listState: listState});',
              'var html = elementToHtml(document, messages, {});',
              1
          )

          start = text.index('    function convertElements(elements, messages, options) {')
          end = text.index('    function elementToHtml(element, messages, options) {', start)
          replacement = '''    function convertElements(elements, messages, options) {\n        var result = [];\n        var listIndentationLevels = [];\n\n        for (var i = 0; i < elements.length; i++) {\n            var element = elements[i];\n            if (element.type === documents.types.paragraph && element.numbering) {\n                var listLevel = resolveListLevel(element, listIndentationLevels);\n                var elementOptions = _.extend({}, options, {listLevel: listLevel});\n                result = result.concat(elementToHtml(element, messages, elementOptions));\n            } else {\n                listIndentationLevels = [];\n                result = result.concat(elementToHtml(element, messages, options));\n            }\n        }\n\n        return result;\n    }\n\n'''
          text = text[:start] + replacement + text[end:]

          # Drop startOverride/continuation/fresh-list manipulation from paragraphs.
          marker_start = text.index('        var htmlPath = htmlPathForParagraph(paragraphForStyle, messages);')
          class_line = text.index('        htmlPath = withNumberingClass(htmlPath, element.numbering);', marker_start)
          prefix_end = marker_start + len('        var htmlPath = htmlPathForParagraph(paragraphForStyle, messages);')
          text = text[:prefix_end] + '\n\n' + text[class_line:]

          # Remove PR #448 helper functions completely.
          helper_start = text.find('    function modifyHtmlPathForListContinuation(htmlPath, startNumber) {')
          if helper_start != -1:
              helper_end = text.index('    var elementConverters = {', helper_start)
              text = text[:helper_start] + text[helper_end:]

          path.write_text(text)

          # numbering-xml.js: retain numFmt/levelText/indent metadata from our
          # features, but remove numId/startOverride parsing introduced by PR #448.
          path = Path('lib/docx/numbering-xml.js')
          text = path.read_text()
          old = '''        var resolvedLevel;\n        if (abstractNum.numStyleLink == null) {\n            resolvedLevel = abstractNums[num.abstractNumId].levels[level];\n        } else {\n            var style = styles.findNumberingStyleById(abstractNum.numStyleLink);\n            resolvedLevel = findLevelWithSeenNumIds(style.numId, level, seenNumIds);\n        }\n\n        if (resolvedLevel && num.levelOverrides && num.levelOverrides[level]) {\n            resolvedLevel = _.extend({}, resolvedLevel, num.levelOverrides[level]);\n        }\n\n        if (resolvedLevel) {\n            resolvedLevel = _.extend({}, resolvedLevel, {numId: numId});\n        }\n\n        return resolvedLevel;\n'''
          new = '''        if (abstractNum.numStyleLink == null) {\n            return abstractNums[num.abstractNumId].levels[level];\n        } else {\n            var style = styles.findNumberingStyleById(abstractNum.numStyleLink);\n            return findLevelWithSeenNumIds(style.numId, level, seenNumIds);\n        }\n'''
          if old not in text:
              raise SystemExit('Could not locate PR448 numbering resolution block')
          text = text.replace(old, new, 1)

          read_nums_start = text.index('function readNums(root) {')
          replacement = '''function readNums(root) {\n    var nums = {};\n    root.getElementsByTagName("w:num").forEach(function(element) {\n        var numId = element.attributes["w:numId"];\n        var abstractNumId = element.first("w:abstractNumId").attributes["w:val"];\n        nums[numId] = {abstractNumId: abstractNumId};\n    });\n    return nums;\n}\n'''
          text = text[:read_nums_start] + replacement
          path.write_text(text)

          # Remove tests that belonged to PR #448, while leaving our feature tests.
          path = Path('test/document-to-html.tests.js')
          text = path.read_text()
          text = text.replace('var readOptions = require("../lib/options-reader").readOptions;\n', '')
          text = text.replace('var readStyle = require("../lib/style-reader").readStyle;\n', '')
          text = text.replace('var Result = require("../lib/results").Result;\n', '')
          appended = text.find('\nfunction parseStyleMap(styleMap) {')
          if appended == -1:
              raise SystemExit('Could not locate PR448 document-to-html tests')
          text = text[:appended].rstrip() + '\n'
          path.write_text(text)

          path = Path('test/docx/numbering-xml.tests.js')
          text = path.read_text()
          appended = text.find("\ntest('w:startOverride in w:lvlOverride overrides start value'")
          if appended == -1:
              raise SystemExit('Could not locate PR448 numbering tests')
          text = text[:appended].rstrip() + '\n'
          path.write_text(text)

          # The two state-machine regression tests were only needed while PR448
          # continuation tracking existed. Remove those, keep indentation tests.
          path = Path('test/list-indentation.tests.js')
          text = path.read_text()
          for test_name in [
              'ignored empty paragraphs do not break nested ordered lists',
              'nested ordered list re-entry stays under the new parent'
          ]:
              pattern = re.compile(
                  r"\n\ntest\('" + re.escape(test_name) + r"'.*?\n\}\);",
                  re.S
              )
              text, count = pattern.subn('', text, count=1)
              if count != 1:
                  raise SystemExit('Could not remove test: ' + test_name)
          path.write_text(text.rstrip() + '\n')
          PY

      - name: Remove temporary workflows
        run: |
          rm -f .github/workflows/fix-nested-list-reentry.yml
          rm -f .github/workflows/remove-pr448-list-continuation.yml

      - name: Test
        run: |
          npm ci
          npm test
          npm run check-typescript

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove PR 448 list continuation logic"
          git push
