name: Merge preserve alignment

on:
  push:
    branches:
      - feature/numbering-class-map-list-ordering
    paths:
      - .github/workflows/merge-preserve-alignment.yml

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/numbering-class-map-list-ordering

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Cherry-pick standalone alignment change
        id: cherry
        continue-on-error: true
        run: git cherry-pick 087ae3484199a20311f9fc6937ece2e921038d55

      - name: Resolve expected conflicts
        if: steps.cherry.outcome == 'failure'
        run: |
          git checkout --ours README.md lib/document-to-html.js lib/index.d.ts lib/options-reader.js
          git checkout --theirs test/alignment.tests.js
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              text = path.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"Could not find expected text in {path}")
              path.write_text(text.replace(old, new, 1))

          # options-reader.js
          path = Path('lib/options-reader.js')
          text = path.read_text()
          if 'preserveAlignment: false' not in text:
              text = text.replace(
                  '    inferListNestingFromIndentation: false,\n',
                  '    inferListNestingFromIndentation: false,\n    preserveAlignment: false,\n',
                  1
              )
              path.write_text(text)

          # index.d.ts
          path = Path('lib/index.d.ts')
          text = path.read_text()
          if 'preserveAlignment?: boolean;' not in text:
              text = text.replace(
                  '    inferListNestingFromIndentation?: boolean;\n',
                  '    inferListNestingFromIndentation?: boolean;\n    preserveAlignment?: boolean;\n',
                  1
              )
              path.write_text(text)

          # document-to-html.js
          path = Path('lib/document-to-html.js')
          text = path.read_text()
          text = text.replace(
              'inferListNestingFromIndentation: false}, options);',
              'inferListNestingFromIndentation: false, preserveAlignment: false}, options);',
              1
          )
          if 'var preserveAlignment = !!options.preserveAlignment;' not in text:
              text = text.replace(
                  '    var inferListNestingFromIndentation = !!options.inferListNestingFromIndentation;\n',
                  '    var inferListNestingFromIndentation = !!options.inferListNestingFromIndentation;\n    var preserveAlignment = !!options.preserveAlignment;\n',
                  1
              )

          hook_old = '        htmlPath = withNumberingClass(htmlPath, element.numbering);\n\n        return htmlPath.wrap(function() {'
          hook_new = '        htmlPath = withNumberingClass(htmlPath, element.numbering);\n        htmlPath = withParagraphAlignment(htmlPath, element.alignment);\n\n        return htmlPath.wrap(function() {'
          if hook_new not in text:
              if hook_old not in text:
                  raise SystemExit('Could not insert alignment hook')
              text = text.replace(hook_old, hook_new, 1)

          if 'function withParagraphAlignment(path, alignment)' not in text:
              marker = '    function withNumberingClass(path, numbering) {'
              helper = '''    function withParagraphAlignment(path, alignment) {
                  var cssAlignment = cssAlignmentFor(alignment);
                  if (!preserveAlignment || !cssAlignment || !path || !path._elements || path._elements.length === 0) {
                      return path;
                  }

                  var elements = path._elements.slice();
                  var index = elements.length - 1;
                  var element = elements[index];
                  var attributes = _.extend({}, element.attributes || {});
                  attributes.style = appendStyle(attributes.style, "text-align: " + cssAlignment);
                  elements[index] = htmlPaths.element(
                      Object.keys(element.tagNames || {}).length > 1 ? Object.keys(element.tagNames) : element.tagName,
                      attributes,
                      {fresh: element.fresh, separator: element.separator}
                  );

                  return htmlPaths.elements(elements);
              }

              function cssAlignmentFor(alignment) {
                  if (!alignment) {
                      return null;
                  }
                  if (alignment === "both" || alignment === "distribute") {
                      return "justify";
                  }
                  if (alignment === "left" || alignment === "right" || alignment === "center" ||
                          alignment === "start" || alignment === "end" || alignment === "justify") {
                      return alignment;
                  }
                  return null;
              }

              function appendStyle(existingStyle, style) {
                  if (!existingStyle) {
                      return style;
                  }
                  var separator = /;\\s*$/.test(existingStyle) ? " " : "; ";
                  return existingStyle + separator + style;
              }

          '''
              if marker not in text:
                  raise SystemExit('Could not insert alignment helpers')
              text = text.replace(marker, helper + marker, 1)
          path.write_text(text)

          # README
          path = Path('README.md')
          text = path.read_text()
          if 'preserveAlignment' not in text:
              marker = '  * `idPrefix`:'
              block = '''  * `preserveAlignment`: by default, paragraph alignment is not written to HTML.
              Set this option to `true` to preserve Word paragraph alignment as inline `text-align` CSS.
              This also applies to paragraphs inside table cells. Word's `both` and `distribute` values are mapped to CSS `justify`.

          '''
              if marker not in text:
                  raise SystemExit('Could not document preserveAlignment')
              text = text.replace(marker, block + marker, 1)
              path.write_text(text)
          PY
          git add README.md lib/document-to-html.js lib/index.d.ts lib/options-reader.js test/alignment.tests.js
          GIT_EDITOR=true git cherry-pick --continue

      - name: Run tests
        run: |
          npm ci
          npm test
          npm run check-typescript

      - name: Push combined test branch
        run: git push origin HEAD:feature/numbering-class-map-list-ordering
