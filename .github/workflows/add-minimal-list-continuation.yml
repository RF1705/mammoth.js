name: Add minimal list continuation

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/add-minimal-list-continuation.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - name: Apply minimal continuation support
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Preserve numId on resolved numbering metadata. This is deliberately
          # much smaller than PR #448: no startOverride parsing and no global
          # list-state machine.
          p = Path('lib/docx/numbering-xml.js')
          s = p.read_text()
          old = '''        if (abstractNum.numStyleLink == null) {\n            return abstractNums[num.abstractNumId].levels[level];\n        } else {\n            var style = styles.findNumberingStyleById(abstractNum.numStyleLink);\n            return findLevelWithSeenNumIds(style.numId, level, seenNumIds);\n        }\n'''
          new = '''        var resolvedLevel;\n        if (abstractNum.numStyleLink == null) {\n            resolvedLevel = abstractNums[num.abstractNumId].levels[level];\n        } else {\n            var style = styles.findNumberingStyleById(abstractNum.numStyleLink);\n            resolvedLevel = findLevelWithSeenNumIds(style.numId, level, seenNumIds);\n        }\n\n        return resolvedLevel ? _.extend({}, resolvedLevel, {numId: numId}) : null;\n'''
          if old not in s:
              raise SystemExit('numbering resolution block not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('lib/document-to-html.js')
          s = p.read_text()
          old = '''    function convertElements(elements, messages, options) {\n        var result = [];\n        var listIndentationLevels = [];\n\n        for (var i = 0; i < elements.length; i++) {\n            var element = elements[i];\n            if (element.type === documents.types.paragraph && element.numbering) {\n                var listLevel = resolveListLevel(element, listIndentationLevels);\n                var elementOptions = _.extend({}, options, {listLevel: listLevel});\n                result = result.concat(elementToHtml(element, messages, elementOptions));\n            } else {\n                listIndentationLevels = [];\n                result = result.concat(elementToHtml(element, messages, options));\n            }\n        }\n\n        return result;\n    }\n'''
          new = '''    function convertElements(elements, messages, options) {\n        var result = [];\n        var listIndentationLevels = [];\n        var orderedListCounts = {};\n        var listInterrupted = false;\n\n        for (var i = 0; i < elements.length; i++) {\n            var element = elements[i];\n            if (element.type === documents.types.paragraph && element.numbering) {\n                var listLevel = resolveListLevel(element, listIndentationLevels);\n                var numbering = element.numbering;\n                var listKey = numbering.numId !== undefined ?\n                    numbering.numId + "_" + listLevel : null;\n                var listStartNumber = null;\n\n                if (numbering.isOrdered && listKey !== null) {\n                    var previousCount = orderedListCounts[listKey] || 0;\n                    if (listInterrupted && previousCount > 0) {\n                        listStartNumber = previousCount + 1;\n                    }\n                    orderedListCounts[listKey] = previousCount + 1;\n                }\n\n                var elementOptions = _.extend({}, options, {\n                    listLevel: listLevel,\n                    listStartNumber: listStartNumber\n                });\n                result = result.concat(elementToHtml(element, messages, elementOptions));\n                listInterrupted = false;\n            } else {\n                listIndentationLevels = [];\n                if (!isIgnoredEmptyParagraph(element)) {\n                    listInterrupted = true;\n                }\n                result = result.concat(elementToHtml(element, messages, options));\n            }\n        }\n\n        return result;\n    }\n\n    function isIgnoredEmptyParagraph(element) {\n        return ignoreEmptyParagraphs && element.type === documents.types.paragraph &&\n            (!element.children || element.children.length === 0);\n    }\n'''
          if old not in s:
              raise SystemExit('convertElements block not found')
          s = s.replace(old, new, 1)

          old = '''        var htmlPath = htmlPathForParagraph(paragraphForStyle, messages);\n\n        htmlPath = withNumberingClass(htmlPath, element.numbering);\n'''
          new = '''        var htmlPath = htmlPathForParagraph(paragraphForStyle, messages);\n\n        if (options.listStartNumber && element.numbering && element.numbering.isOrdered) {\n            htmlPath = withListStartNumber(htmlPath, options.listStartNumber);\n        }\n        htmlPath = withNumberingClass(htmlPath, element.numbering);\n'''
          if old not in s:
              raise SystemExit('convertParagraph marker not found')
          s = s.replace(old, new, 1)

          marker = '''    function withParagraphAlignment(path, alignment) {\n'''
          helper = '''    function withListStartNumber(path, startNumber) {\n        if (!path || !path._elements) {\n            return path;\n        }\n\n        var elements = path._elements.slice();\n        for (var index = elements.length - 1; index >= 0; index--) {\n            var element = elements[index];\n            if (element.tagName === "ol" || (element.tagNames && element.tagNames.ol)) {\n                elements[index] = _.extend({}, element, {\n                    attributes: _.extend({}, element.attributes || {}, {\n                        start: startNumber.toString()\n                    })\n                });\n                break;\n            }\n        }\n        return htmlPaths.elements(elements);\n    }\n\n'''
          if marker not in s:
              raise SystemExit('alignment helper marker not found')
          s = s.replace(marker, helper + marker, 1)
          p.write_text(s)

          # Focused tests for interrupted continuation and nested-list safety.
          p = Path('test/list-continuation.tests.js')
          p.write_text('''var assert = require("assert");\n\nvar documents = require("../lib/documents");\nvar documentToHtml = require("../lib/document-to-html");\nvar test = require("./test")(module);\n\nfunction run(text) {\n    return new documents.Run([new documents.Text(text)]);\n}\n\nfunction paragraph(text, numbering) {\n    return new documents.Paragraph([run(text)], {numbering: numbering});\n}\n\nfunction converter() {\n    return new documentToHtml.DocumentConverter({\n        styleMap: [\n            {from: {type: "paragraph", list: {isOrdered: true, levelIndex: "0"}}, to: require("../lib/styles/html-paths").elements([\n                require("../lib/styles/html-paths").element("ol", {}, {fresh: false}),\n                require("../lib/styles/html-paths").element("li", {}, {fresh: false})\n            ])},\n            {from: {type: "paragraph", list: {isOrdered: true, levelIndex: "1"}}, to: require("../lib/styles/html-paths").elements([\n                require("../lib/styles/html-paths").element("ol", {}, {fresh: false}),\n                require("../lib/styles/html-paths").element("li", {}, {fresh: false}),\n                require("../lib/styles/html-paths").element("ol", {}, {fresh: false}),\n                require("../lib/styles/html-paths").element("li", {}, {fresh: false})\n            ])}\n        ]\n    });\n}\n\ntest('ordered list resumes after a normal paragraph with the next number', function() {\n    var root = {isOrdered: true, level: "0", numId: "1"};\n    var document = new documents.Document([\n        paragraph("One", root),\n        paragraph("Two", root),\n        paragraph("Three", root),\n        new documents.Paragraph([run("Interruption")]),\n        paragraph("Four", root)\n    ]);\n\n    return converter().convertToHtml(document).then(function(result) {\n        assert.equal(result.value,\n            '<ol><li>One</li><li>Two</li><li>Three</li></ol>' +\n            '<p>Interruption</p><ol start="4"><li>Four</li></ol>');\n    });\n});\n\ntest('nested list re-entry does not create continuation start attributes', function() {\n    var root = {isOrdered: true, level: "0", numId: "1"};\n    var nested = {isOrdered: true, level: "1", numId: "1"};\n    var document = new documents.Document([\n        paragraph("Parent 1", root),\n        paragraph("Child 1.1", nested),\n        paragraph("Parent 2", root),\n        paragraph("Child 2.1", nested)\n    ]);\n\n    return converter().convertToHtml(document).then(function(result) {\n        assert.equal(result.value.indexOf('start='), -1);\n    });\n});\n''')
          PY

      - name: Remove temporary workflow
        run: rm .github/workflows/add-minimal-list-continuation.yml

      - name: Test
        run: |
          npm ci
          npm test
          npm run check-typescript

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Resume interrupted ordered lists minimally"
          git push
