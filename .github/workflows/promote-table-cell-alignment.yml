name: Promote table cell alignment

on:
  push:
    branches:
      - feature/preserve-paragraph-alignment
    paths:
      - .github/workflows/promote-table-cell-alignment.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/preserve-paragraph-alignment

      - name: Apply table cell alignment changes
        run: python3 .github/scripts/promote-table-cell-alignment.py

      - name: Test
        run: |
          npm ci
          npm test
          npm run check-typescript

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/document-to-html.js test/alignment.tests.js
          git commit -m "Preserve alignment on table cells"
          git push
