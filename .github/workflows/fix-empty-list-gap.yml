name: Fix empty list gap

on:
  push:
    branches:
      - feature/numbering-class-map-list-ordering
    paths:
      - .github/workflows/fix-empty-list-gap.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/numbering-class-map-list-ordering

      - name: Apply fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('lib/document-to-html.js')
          s = p.read_text()

          old = '''        for (var i = 0; i < elements.length; i++) {\n            var element = elements[i];\n            \n            // Track list state for paragraphs with numbering\n            if (element.type === "paragraph" && element.numbering) {\n'''
          new = '''        for (var i = 0; i < elements.length; i++) {\n            var element = elements[i];\n\n            // Empty Word paragraphs are ignored by default and therefore must\n            // not interrupt an otherwise continuous list. Treat them as\n            // transparent for list-state tracking as well.\n            if (ignoreEmptyParagraphs && isStructurallyEmptyParagraph(element)) {\n                result = result.concat(elementToHtml(element, messages, options));\n                continue;\n            }\n            \n            // Track list state for paragraphs with numbering\n            if (element.type === "paragraph" && element.numbering) {\n'''
          if old not in s:
              raise SystemExit('convertElements loop marker not found')
          s = s.replace(old, new, 1)

          marker = '''    function elementToHtml(element, messages, options) {\n'''
          helper = '''    function isStructurallyEmptyParagraph(element) {\n        return element && element.type === documents.types.paragraph &&\n            !element.numbering && paragraphHasNoContent(element);\n    }\n\n    function paragraphHasNoContent(element) {\n        return !element.children || element.children.every(function(child) {\n            if (child.type === documents.types.run) {\n                return !child.children || child.children.every(function(runChild) {\n                    return runChild.type === documents.types.text && !runChild.value;\n                });\n            }\n            return child.type === documents.types.text && !child.value;\n        });\n    }\n\n'''
          if helper not in s:
              if marker not in s:
                  raise SystemExit('elementToHtml marker not found')
              s = s.replace(marker, helper + marker, 1)
          p.write_text(s)

          p = Path('test/list-indentation.tests.js')
          s = p.read_text()
          if "ignored empty paragraphs do not break nested ordered lists" not in s:
              s += '''\n\ntest('ignored empty paragraphs do not break nested ordered lists', function() {\n    var root = {\n        isOrdered: true,\n        level: "0",\n        numId: "1",\n        numFmt: "decimal",\n        levelText: "%1."\n    };\n    var nested = {\n        isOrdered: true,\n        level: "1",\n        numId: "1",\n        numFmt: "decimal",\n        levelText: "%1.%2"\n    };\n\n    var document = new documents.Document([\n        paragraph("Heading", root),\n        new documents.Paragraph([]),\n        paragraph("First nested item", nested),\n        new documents.Paragraph([]),\n        paragraph("Second nested item", nested)\n    ]);\n\n    return converter({\n        numberingClassMap: [{\n            numFmt: "decimal",\n            levelText: "%1.%2",\n            className: "legal-list"\n        }]\n    }).convertToHtml(document).then(function(result) {\n        assert.equal(result.value,\n            '<ol><li>Heading<ol class="legal-list"><li>First nested item</li>' +\n            '<li>Second nested item</li></ol></li></ol>');\n    });\n});\n'''
              p.write_text(s)
          PY

      - name: Test
        run: |
          npm ci
          npm test
          npm run check-typescript

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/document-to-html.js test/list-indentation.tests.js
          git commit -m "Ignore empty paragraphs when tracking lists"
          git push
