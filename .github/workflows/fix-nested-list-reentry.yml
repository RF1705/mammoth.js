name: Fix nested list reentry

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/fix-nested-list-reentry.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - name: Apply fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('lib/document-to-html.js')
          s = p.read_text()

          old = '''                var returningFromNestedList = lastWasListItem &&\n                    lastListLevel !== null && listLevel < lastListLevel;\n                if (listKey === lastListKey && lastWasListItem) {\n                    // Same list, consecutive items - use the same start number if in a continued list\n                    isListContinuation = false;\n                } else if (returningFromNestedList) {\n                    // A child list has ended. Keep the parent HTML list open rather\n                    // than restarting it with a start attribute.\n                    isListContinuation = false;\n                } else if (listState.currentLists[listKey].count > 0) {\n'''
          new = '''                var returningFromNestedList = lastWasListItem &&\n                    lastListLevel !== null && listLevel < lastListLevel;\n                var enteringNestedList = lastWasListItem &&\n                    lastListLevel !== null && listLevel > lastListLevel;\n                if (listKey === lastListKey && lastWasListItem) {\n                    // Same list, consecutive items - use the same start number if in a continued list\n                    isListContinuation = false;\n                } else if (returningFromNestedList) {\n                    // A child list has ended. Keep the parent HTML list open rather\n                    // than restarting it with a start attribute.\n                    isListContinuation = false;\n                } else if (enteringNestedList) {\n                    // Entering a child list below the current item is structural nesting,\n                    // not a resumed top-level list. Marking it as a continuation makes\n                    // the child list fresh and can force Mammoth's ul|ol ancestor path\n                    // to materialise as a spurious <ul>.\n                    isListContinuation = false;\n                } else if (listState.currentLists[listKey].count > 0) {\n'''
          if old not in s:
              raise SystemExit('list continuation block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('test/list-indentation.tests.js')
          s = p.read_text()
          if "nested ordered list re-entry stays under the new parent" not in s:
              s += '''\n\ntest('nested ordered list re-entry stays under the new parent', function() {\n    var root = {\n        isOrdered: true,\n        level: "0",\n        numId: "1",\n        numFmt: "decimal",\n        levelText: "%1."\n    };\n    var nested = {\n        isOrdered: true,\n        level: "1",\n        numId: "1",\n        numFmt: "decimal",\n        levelText: "%1.%2"\n    };\n\n    var document = new documents.Document([\n        paragraph("Parent 1", root),\n        paragraph("Child 1.1", nested),\n        paragraph("Child 1.2", nested),\n        paragraph("Parent 2", root),\n        paragraph("Child 2.1", nested),\n        paragraph("Child 2.2", nested)\n    ]);\n\n    return converter({\n        numberingClassMap: [{\n            numFmt: "decimal",\n            levelText: "%1.%2",\n            className: "legal-list"\n        }]\n    }).convertToHtml(document).then(function(result) {\n        assert.equal(result.value,\n            '<ol><li>Parent 1<ol class="legal-list"><li>Child 1.1</li><li>Child 1.2</li></ol></li>' +\n            '<li>Parent 2<ol class="legal-list"><li>Child 2.1</li><li>Child 2.2</li></ol></li></ol>');\n    });\n});\n'''
              p.write_text(s)
          PY

      - name: Test
        run: |
          npm ci
          npm test
          npm run check-typescript

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/document-to-html.js test/list-indentation.tests.js
          git commit -m "Fix nested list re-entry after parent items"
          git push
