name: Apply preserve alignment standalone

on:
  push:
    branches:
      - feature/preserve-paragraph-alignment
    paths:
      - .github/workflows/apply-preserve-alignment-standalone.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/preserve-paragraph-alignment
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 .github/scripts/add-preserve-alignment-standalone.py
          git add lib test README.md
          git commit -m "Preserve paragraph alignment in HTML"
          npm ci
          npm test
          git push origin HEAD:feature/preserve-paragraph-alignment
