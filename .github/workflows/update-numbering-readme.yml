name: Update numbering README

on:
  push:
    branches:
      - feature/numbering-class-map
    paths:
      - .github/workflows/update-numbering-readme.yml

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/numbering-class-map
      - name: Fix lint issue
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("lib/document-to-html.js")
          text = path.read_text()
          text = text.replace(
              'id: noteRefHtmlId(element),\n',
              'id: noteRefHtmlId(element)\n',
              1
          )
          path.write_text(text)
          PY
      - name: Commit fix
        run: |
          if git diff --quiet -- lib/document-to-html.js; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/document-to-html.js
          git commit -m "Fix numbering class map lint"
          git push origin HEAD:feature/numbering-class-map
