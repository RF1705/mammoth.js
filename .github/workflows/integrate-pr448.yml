name: Integrate PR 448

on:
  push:
    branches:
      - feature/numbering-class-map-list-ordering
    paths:
      - .github/workflows/integrate-pr448.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/numbering-class-map-list-ordering

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch PR 448
        run: git fetch https://github.com/mwilliamson/mammoth.js.git pull/448/head:pr448

      - name: Cherry-pick PR 448
        id: cherry_pick
        continue-on-error: true
        run: git cherry-pick f13c5ad74e921979a2bb75ab02e04b7e9ec480bb

      - name: Resolve known conflicts
        if: steps.cherry_pick.outcome == 'failure'
        run: |
          python3 .github/scripts/integrate-pr448.py
          git add lib/document-to-html.js lib/docx/numbering-xml.js
          GIT_EDITOR=true git cherry-pick --continue

      - name: Run tests
        run: |
          npm ci
          npm test

      - name: Push combined branch
        run: git push origin HEAD:feature/numbering-class-map-list-ordering
